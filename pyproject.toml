[project]
name = "aitobuild"
version = "0.1.0"
description = "Agentic product team framework"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "agent-framework==1.0.0",
  "croniter>=3.0.3",
  "fastapi>=0.115.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "ruff>=0.11.0",
  "types-croniter>=6.0.0.20250516",
  "mypy>=1.15.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aitobuild"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
